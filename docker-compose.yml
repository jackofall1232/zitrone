services:
  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sub:${POSTGRES_PASSWORD:-sub}@postgres:5432/zitrone?sslmode=disable
      JWT_PRIVATE_KEY_PATH: /keys/jwt.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt.pub.pem
      SERVER_PORT: "8443"
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
      MAX_PREKEYS_PER_USER: ${MAX_PREKEYS_PER_USER:-100}
      MESSAGE_TTL_UNDELIVERED_HOURS: ${MESSAGE_TTL_UNDELIVERED_HOURS:-72}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TOR_ENABLED: ${TOR_ENABLED:-false}
      ONION_ADDRESS: ${ONION_ADDRESS:-}
      # 0.9.4 registration proof-of-work — CALIBRATION DEPLOY, ENFORCEMENT OFF.
      #
      # The challenge token carries NO parameters: client and relay agree by
      # configuration alone, so every value below must match the shipped 0.9.4
      # client exactly or its solutions will never verify. Pinned explicitly
      # rather than left to config.go's defaults — REGISTRATION_ARGON2_DIFFICULTY_BITS
      # in particular defaults to 8 while the client ships D=4.
      #
      # Argon2id parallelism is NOT here: regpow.Argon2Threads is a compile-time
      # constant fixed at 1 (cross-platform determinism), which already matches
      # the client's p=1. There is no env var for it.
      REGISTRATION_POW_ENABLED: ${REGISTRATION_POW_ENABLED:-false}
      REGISTRATION_HASHCASH_DIFFICULTY: ${REGISTRATION_HASHCASH_DIFFICULTY:-20}
      REGISTRATION_ARGON2_DIFFICULTY_BITS: ${REGISTRATION_ARGON2_DIFFICULTY_BITS:-4}
      REGISTRATION_ARGON2_TIME_COST: ${REGISTRATION_ARGON2_TIME_COST:-1}
      REGISTRATION_ARGON2_MEMORY_KIB: ${REGISTRATION_ARGON2_MEMORY_KIB:-19456}
      # Required even with enforcement off: RegistrationChallenge fails closed
      # with 503 pow_unavailable on an empty secret, and config.Load only
      # validates this when enforcement is ON. Unset here means no challenge.
      REGISTRATION_CHALLENGE_SECRET: ${REGISTRATION_CHALLENGE_SECRET:-}
    volumes:
      - ./server/keys:/keys:ro
    ports:
      - "127.0.0.1:8443:8443"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sub}
      POSTGRES_DB: zitrone
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub -d zitrone"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port — only the server container reaches the database.

volumes:
  pg-data:
