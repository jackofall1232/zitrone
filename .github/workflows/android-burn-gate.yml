# Pucker Burn byte-for-byte gate (0.9.2 Unit W-B).
#
# Asserts that post-burn app-local state is indistinguishable from post-fresh-install state. This
# runs on an EMULATOR rather than under Robolectric for one reason: Robolectric provides no
# AndroidKeyStore, so it cannot see Keystore aliases or EncryptedSharedPreferences — which is
# precisely the half of the coverage set the gate exists for. A gate that formally excludes the
# artifacts it was built to check is not a gate.
#
# ─── WHY THIS JOB IS SLOW AND SOMETIMES FLAKY, AND WHY THAT IS ACCEPTED ──────────────────────────
# ~8 minutes on any PR touching apps/android/**, and emulators are the least reliable thing in any
# CI matrix. That cost is accepted deliberately: this is the ONLY route that reaches the Keystore
# half. The alternative on the table was Robolectric with the Keystore and encrypted-prefs residue
# excluded — cheaper, faster, and silent about exactly the artifacts a duress wipe must not leave
# behind. If this job is ever considered for removal on cost grounds, the thing being removed is
# Keystore-residue coverage, not "a slow job".
#
# ─── WHY THERE IS NO TEST RETRY, AND WHY ADDING ONE WOULD BE WRONG ───────────────────────────────
# The emulator BOOT may be retried — that is infrastructure, and a failed boot proves nothing about
# the product. The instrumented TEST is never retried. A retried burn-residue test converts a REAL
# failure (an artifact survived a wipe) into a flake, and on this gate specifically "it's flaky"
# would become the standing explanation for the one signal that matters. Boot retry is
# infrastructure; test retry would be the gate lying.
name: Android — burn byte-for-byte gate

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-burn-gate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'

permissions:
  contents: read

concurrency:
  group: burn-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  burn-gate:
    name: Post-burn state == post-fresh-install state
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Hardware acceleration is available on GitHub-hosted Linux runners, but /dev/kvm needs
      # permissions granted first; without this the emulator falls back to software and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # DIGEST-PINNED: a third-party action runs with access to this repo's checkout, so it is
      # pinned to an immutable commit rather than a movable tag.
      - name: Burn gate on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          # NOTE: `script` runs ONCE. No test-level retry — see the header.
          script: cd apps/android && ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload gate report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-gate-report
          path: apps/android/app/build/reports/androidTests/
          retention-days: 7
